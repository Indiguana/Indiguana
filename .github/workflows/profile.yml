name: Update Profile

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/build_graph.py'
      - 'docs/index.html'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build graph data and GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Indiguana
        run: python scripts/build_graph.py

      - uses: Platane/snk@v3
        with:
          github_user_name: Indiguana
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark&color_snake=green&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit generated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/graph_data.json assets/
          git diff --staged --quiet || git commit -m "chore: regenerate profile assets"
          git push

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
