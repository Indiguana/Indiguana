<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indi Kolluru — Repo Knowledge Graph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #graph { width: 100vw; height: 100vh; }

    #panel {
      position: fixed; top: 16px; left: 16px;
      background: rgba(22,27,34,.92);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px 16px;
      max-width: 260px;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    #panel h1 { font-size: 15px; color: #58a6ff; margin-bottom: 3px; }
    #panel p  { font-size: 11px; color: #8b949e; line-height: 1.45; }

    #tip {
      position: fixed; display: none;
      background: rgba(22,27,34,.96);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 12px;
      z-index: 20;
      pointer-events: none;
      max-width: 260px;
    }
    #tip h3   { font-size: 13px; color: #58a6ff; margin-bottom: 3px; }
    #tip .l   { font-size: 10px; margin-bottom: 3px; }
    #tip .d   { font-size: 10px; color: #8b949e; }

    #legend {
      position: fixed; bottom: 16px; left: 16px;
      background: rgba(22,27,34,.92);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 14px;
      z-index: 10;
      display: flex; flex-wrap: wrap; gap: 6px 14px;
    }
    .li { display: flex; align-items: center; gap: 5px; font-size: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Repo Knowledge Graph</h1>
    <p>Repos linked by shared languages &amp; topics.<br>Drag to explore. Click a node to open the repo.</p>
  </div>
  <div id="tip"><h3 id="tn"></h3><div class="l" id="tl"></div><div class="d" id="td"></div></div>
  <div id="graph"></div>
  <div id="legend"></div>

  <script src="https://unpkg.com/3d-force-graph@1"></script>
  <script>
    fetch('graph_data.json').then(r => r.json()).then(data => {
      const el = document.getElementById('graph');
      const tip = document.getElementById('tip');

      // legend
      const seen = new Map();
      data.nodes.forEach(n => { if (!seen.has(n.language)) seen.set(n.language, n.color); });
      const leg = document.getElementById('legend');
      [...seen.entries()].sort((a,b) => a[0].localeCompare(b[0])).forEach(([l,c]) => {
        const d = document.createElement('div');
        d.className = 'li';
        d.innerHTML = '<div class="dot" style="background:'+c+'"></div>'+l;
        leg.appendChild(d);
      });

      const G = ForceGraph3D()(el)
        .graphData(data)
        .backgroundColor('#0d1117')
        .nodeColor(n => n.color)
        .nodeVal(n => n.val || 4)
        .nodeLabel('')
        .nodeOpacity(0.95)
        .nodeResolution(16)
        .linkColor(() => 'rgba(88,166,255,0.55)')
        .linkWidth(l => Math.max(1, l.weight * 1.5))
        .linkOpacity(0.6)
        .linkLabel(l => l.label || '')
        .linkDirectionalParticles(l => l.weight)
        .linkDirectionalParticleWidth(1.5)
        .linkDirectionalParticleColor(() => '#58a6ff')
        .onNodeHover(node => {
          el.style.cursor = node ? 'pointer' : 'default';
          if (node) {
            tip.style.display = 'block';
            document.getElementById('tn').textContent = node.id;
            document.getElementById('tl').innerHTML =
              '<span style="color:'+node.color+'">&#9679;</span> ' + node.language +
              (node.stars ? ' &middot; '+node.stars+' &#9733;' : '');
            document.getElementById('td').textContent = node.description || 'No description';
          } else {
            tip.style.display = 'none';
          }
        })
        .onNodeClick(node => { if (node.url) window.open(node.url, '_blank'); })
        .enableNodeDrag(true)
        .enableNavigationControls(true)
        .warmupTicks(40)
        .cooldownTicks(0);

      // gentle auto-rotate
      let a = 0;
      const dist = 220;
      (function spin() {
        G.cameraPosition({ x: dist*Math.sin(a), z: dist*Math.cos(a) });
        a += 0.0018;
        requestAnimationFrame(spin);
      })();

      el.addEventListener('mousemove', e => {
        tip.style.left = (e.clientX+14)+'px';
        tip.style.top  = (e.clientY+14)+'px';
      });
    });
  </script>
</body>
</html>
